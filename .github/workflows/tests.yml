name: Tests

# Unit tests, then a smoke test of the production build: pages render, the
# NIP-05 endpoint and the security headers are in place.
# See tests/ and scripts/smoke-test.mjs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run test:smoke
