# Headers for pages and /.well-known/nostr.json are not set here. Those are
# served by the server function, which Netlify's header rules don't apply to.
# See nuxt.config.ts (security) and server/api/nip05.ts.

[[redirects]]
  from = "/nprofile*"
  to = "/nprofile:splat"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]